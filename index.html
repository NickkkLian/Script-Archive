<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剧本档案 · Script Archive</title>
<meta name="robots" content="noindex">
<style>
  /* 系统字体栈：不引入任何外部字体/CDN，页面完全自包含 */
  :root{
    --bg:#0e0f0c; --panel:#16170f; --panel2:#1c1d14;
    --ink:#ece7d6; --muted:#8d8a78; --line:#2c2c20;
    --amber:#e0aa3e; --green:#7fae6a; --red:#c9695a; --blue:#6f93b8; --violet:#9b8ec4;
    --mono:ui-monospace,SFMono-Regular,Menlo,'DejaVu Sans Mono',monospace;
    --sans:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(1200px 600px at 80% -10%, rgba(224,170,62,.07), transparent 60%);
    min-height:100vh}
  a{color:var(--amber)}
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px}

  header{border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;
    background:rgba(14,15,12,.94);backdrop-filter:blur(8px)}
  .top{display:flex;align-items:baseline;justify-content:space-between;padding:14px 0 8px;gap:12px;flex-wrap:wrap}
  .brand{font-weight:600;font-size:24px;letter-spacing:.3px}
  .brand .dot{color:var(--amber)}
  .brand small{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:2px;
    text-transform:uppercase;display:block;margin-top:1px;font-weight:400}
  .status{font-family:var(--mono);font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .led{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
  .led.off{background:var(--red);box-shadow:0 0 8px var(--red)}
  .iconbtn{background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--mono);
    font-size:11px;padding:5px 10px;border-radius:6px;cursor:pointer}
  .iconbtn:hover{color:var(--ink);border-color:var(--amber)}
  nav{display:flex;gap:2px;flex-wrap:wrap;padding-bottom:2px}
  .tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);
    font-family:var(--mono);font-size:12.5px;letter-spacing:.5px;padding:9px 13px;cursor:pointer;text-transform:uppercase}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--amber);border-bottom-color:var(--amber)}

  main{padding:22px 0 90px}
  h2.head{font-size:20px;font-weight:600;margin-bottom:3px}
  .sub{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:14px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  input,select,textarea{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    font-family:var(--sans);font-size:14px;padding:7px 10px;border-radius:7px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--amber)}
  .btn{background:var(--amber);color:#1a1608;border:0;font-weight:600;font-size:13px;
    padding:8px 14px;border-radius:7px;cursor:pointer;font-family:var(--sans)}
  .btn.ghost{background:none;color:var(--muted);border:1px solid var(--line)}
  .btn.ghost:hover{color:var(--ink);border-color:var(--amber)}
  .btn.danger{background:none;color:var(--red);border:1px solid var(--red)}
  .btn:disabled{opacity:.5;cursor:default}
  .meta{font-family:var(--mono);font-size:11px;color:var(--muted)}

  /* 梯队 */
  .tierrow{display:grid;grid-template-columns:66px 1fr;gap:12px;align-items:start;
    border-bottom:1px solid var(--line);padding:11px 0}
  .tierrow:last-child{border-bottom:0}
  .tiername{font-family:var(--mono);font-weight:600;font-size:17px;text-align:center;
    padding:5px 0;border-radius:7px;letter-spacing:1px}
  .t-SSS{background:#4a2f10;color:#ffd479}.t-SS{background:#43320f;color:#f0c46a}
  .t-S{background:#3a3312;color:#dcc061}.t-Aplus{background:#2f3618;color:#bfd07a}
  .t-A{background:#26341c;color:#a9c98b}.t-B{background:#1f3128;color:#8fc0a6}
  .t-C{background:#1d2b33;color:#87b3c6}.t-D{background:#2b2436;color:#a99ac9}
  .t-F{background:#38201f;color:#d18d84}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:6px;
    padding:4px 9px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .chip:hover{border-color:var(--amber)}
  .chip .sc{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
  .chip .no{font-family:var(--mono);font-size:10px;color:var(--amber)}
  .chip.ty-推理{border-left:3px solid var(--blue)}
  .chip.ty-情感{border-left:3px solid var(--red)}
  .chip.ty-欢乐{border-left:3px solid var(--green)}
  .chip.ty-立意{border-left:3px solid var(--violet)}

  /* 多列 */
  .cols{display:grid;gap:14px}
  .cols.c4{grid-template-columns:repeat(4,1fr)}
  .cols.c3{grid-template-columns:repeat(3,1fr)}
  @media(max-width:900px){.cols.c4,.cols.c3{grid-template-columns:1fr 1fr}}
  @media(max-width:600px){.cols.c4,.cols.c3{grid-template-columns:1fr}}
  .colhead{font-family:var(--mono);font-size:11.5px;color:var(--amber);letter-spacing:.5px;
    padding-bottom:7px;border-bottom:1px solid var(--line);margin-bottom:8px;display:flex;justify-content:space-between}
  ol.rank{list-style:none;counter-reset:r}
  ol.rank li{counter-increment:r;display:flex;gap:8px;padding:3px 0;font-size:13.5px;cursor:pointer;align-items:baseline}
  ol.rank li:hover{color:var(--amber)}
  ol.rank li::before{content:counter(r);font-family:var(--mono);font-size:10.5px;color:var(--muted);
    min-width:22px;text-align:right;flex:none}
  ol.rank li .s{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-left:auto;flex:none}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-transform:uppercase;
    text-align:left;font-weight:400;padding:6px 8px;border-bottom:1px solid var(--line)}
  td{padding:7px 8px;border-bottom:1px solid var(--line)}
  td.num,th.num{text-align:right;font-family:var(--mono)}
  tr.clik{cursor:pointer}tr.clik:hover td{color:var(--amber)}

  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(6,7,5,.78);backdrop-filter:blur(3px);
    display:none;align-items:flex-start;justify-content:center;z-index:60;padding:40px 16px;overflow:auto}
  .mask.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    max-width:560px;width:100%;padding:20px}
  .modal h3{font-size:19px;margin-bottom:2px}
  .fld{margin:11px 0}
  .fld label{display:block;font-family:var(--mono);font-size:10.5px;color:var(--muted);
    text-transform:uppercase;margin-bottom:4px}
  .fld input,.fld select,.fld textarea{width:100%}
  .badge{display:inline-block;font-family:var(--mono);font-size:10px;padding:2px 7px;
    border-radius:5px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:10px 18px;
    border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:.22s;z-index:80}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{border-color:var(--red);color:#f0b4ab}

  /* 默认隐藏：脚本判断后才决定要不要弹。否则每次打开都会闪一下登录页，像是没接上共享配置 */
  #gate{position:fixed;inset:0;background:var(--bg);z-index:90;display:none;
    align-items:center;justify-content:center;padding:20px}
  #gate.on{display:flex}
  .gatebox{max-width:430px;width:100%}
  .savebar{position:fixed;right:18px;bottom:18px;z-index:50;display:flex;gap:8px;align-items:center}
  .hide{display:none !important}
</style>
</head>
<body>

<div id="gate">
  <div class="gatebox">
    <div class="brand" style="margin-bottom:6px">剧本档案<span class="dot">.</span><small>Script Archive</small></div>
    <p class="meta" style="margin-bottom:14px" id="g_sub">连接你的私有数据仓库。凭据只保存在本机浏览器，永远不会写入网页代码。</p>
    <div class="fld"><label id="g_l1">GitHub 用户名 (owner)</label><input id="g_owner" autocomplete="off"></div>
    <div class="fld"><label id="g_l2">私有仓库名 (repo)</label><input id="g_repo" autocomplete="off"></div>
    <div class="fld"><label id="g_l3">Token（只需该仓库 Contents 读写）</label><input id="g_token" type="password" autocomplete="off"></div>
    <div class="row" style="margin-top:12px"><button class="btn" id="g_go">连接</button><span class="meta" id="g_err"></span></div>
  </div>
</div>

<header>
  <div class="wrap">
    <div class="top">
      <div class="brand">剧本档案<span class="dot">.</span><small>Script Archive</small></div>
      <div class="status">
        <span class="pill"><span class="led off" id="led"></span><span id="conn">未连接</span></span>
        <span id="stat"></span>
        <button class="iconbtn" id="btn-refresh">刷新</button>
        <button class="iconbtn" id="btn-lang">EN</button>
        <button class="iconbtn" id="btn-set">设置</button>
      </div>
    </div>
    <nav id="nav"></nav>
  </div>
</header>

<main class="wrap">
  <div class="card row" style="margin-bottom:18px">
    <input id="q" placeholder="搜剧本名…" style="flex:1;min-width:200px" autocomplete="off">
    <button class="btn" id="btn-add">＋ 新增剧本</button>
  </div>
  <div id="searchout" class="hide card"></div>
  <section id="view-tier"></section>
  <section id="view-cat" class="hide"></section>
  <section id="view-year" class="hide"></section>
  <section id="view-list" class="hide"></section>
  <section id="view-host" class="hide"></section>
  <section id="view-sess" class="hide"></section>
</main>

<div class="savebar hide" id="savebar">
  <span class="meta" id="savemsg"></span>
  <button class="btn" id="btn-save">保存</button>
</div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   Script Archive —— 单文件应用，数据存在使用者自己的私有仓库里。

   数据模型：每条只存 (name, score, type, year, rank)，其余视图全部由此推导：
     · 梯队 SSS..F  ← score 分档（见 TIER_RULES）
     · 类型排行     ← 按 type 过滤 + 按 rank 排，名次现算
     · 年度榜       ← 按 year 分组、按 type 分栏、按 rank 排，前十现标号

   ⚠️ rank 是排序的唯一真相源，score 只决定档位。两条不变量必须一直成立：
     1. rank 稠密唯一（0..n-1）——增删改后调用 reseat()
     2. rank 的先后必须与 score 的高低一致——所以只允许在同分组内上下移；
        改了 score 就用 seatByScore() 落到新分数组末尾。
     破坏第 2 条会让各视图互相打架，界面右上角的自检就是盯这个的。
   ═══════════════════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- 状态 ---------- */
let CFG = {owner:'',repo:'',token:''};
let DATA = null;          // {updated_at, scripts[], lists[], sessions[]}
let SHA = null;
let dirty = false;
let TAB = 'tier';
const FILE = 'script-archive.json';   // 位于所连仓库的根目录

/* ---------- 双语（语言偏好存在同源共享键里） ---------- */
let lang = (()=>{ try{ return localStorage.getItem('pha-lang')==='en'?'en':'zh' }catch{ return 'zh' } })();
const T = (zh,en) => lang==='en' ? en : zh;
// ⚠️ 分三层，别混：
//   id（存进数据里的值，**绝不能改**，改了要迁移全部条目）：推理 / 情感 / 欢乐 / 立意
//   展示名（只影响界面，随便改）：见 TYPE_LABEL
//   CSS 类名 .ty-<id>：跟着 id 走（展示名带斜杠，做不了类名）
const TYPES = ['推理','情感','欢乐','立意'];
const TYPE_LABEL = {
  '推理': {zh:'推理/还原',      en:'Mystery / Reconstruction'},
  '情感': {zh:'情感',           en:'Drama'},
  '欢乐': {zh:'机制/阵营/欢乐', en:'Mechanics / Factions / Fun'},
  '立意': {zh:'体验/全类型',    en:'Experience / All-round'},
};
const tyLabel = v => (TYPE_LABEL[v] || {})[lang] || v;

/* ---------- 梯队规则：分数 → 档位 ---------- */
const TIER_RULES = [['SSS',9.0],['SS',8.0],['S',7.5],['A+',7.0],['A',6.5],['B',6.0],['C',5.0],['D',3.0],['F',0]];
const TIERS = TIER_RULES.map(t=>t[0]);
const tierOf = sc => sc==null ? null : (TIER_RULES.find(([,lo])=>sc>=lo-1e-9)||['F'])[0];
const tierClass = t => 't-'+String(t).replace('+','plus');
// 年度榜默认只看 A+ 及以上（可在界面上取消勾选）
const TOP_TIERS = new Set(['SSS','SS','S','A+']);

/* ---------- GitHub ---------- */
const b64e = s => { const b=new TextEncoder().encode(s); let x=''; b.forEach(c=>x+=String.fromCharCode(c)); return btoa(x); };
const b64d = b => new TextDecoder().decode(Uint8Array.from(atob(String(b).replace(/\s/g,'')), c=>c.charCodeAt(0)));
const ghURL = () => `https://api.github.com/repos/${CFG.owner}/${CFG.repo}/contents/${FILE}`;

async function ghGet(){
  // cache:'no-store' 不是多余的：同一个 contents URL 若既被当 raw 取过又要取 JSON，
  // 浏览器不按 Accept 分桶，.json() 可能拿到上一次缓存的原始字节。
  const r = await fetch(ghURL(), {headers:{Authorization:`Bearer ${CFG.token}`,Accept:'application/vnd.github+json'}, cache:'no-store'});
  if(r.status===404) return {data:null, sha:null};
  if(r.status===401||r.status===403) throw new Error('AUTH');
  if(!r.ok) throw new Error('GitHub '+r.status);
  const j = await r.json();
  return {data: JSON.parse(b64d(j.content)), sha: j.sha};
}
async function ghPut(obj, sha, msg){
  const body = {message: msg, content: b64e(JSON.stringify(obj,null,2))};
  if(sha) body.sha = sha;
  let r = await fetch(ghURL(), {method:'PUT',headers:{Authorization:`Bearer ${CFG.token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
  if(r.status===409){ const cur = await ghGet(); body.sha = cur.sha;
    r = await fetch(ghURL(), {method:'PUT',headers:{Authorization:`Bearer ${CFG.token}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)}); }
  if(!r.ok) throw new Error('GitHub '+r.status+': '+(await r.text()).slice(0,120));
  return (await r.json()).content.sha;
}

/* ---------- 小工具 ---------- */
let toastT=null;
function toast(msg, err){
  const t=$('toast'); t.textContent=msg; t.className='toast on'+(err?' err':'');
  clearTimeout(toastT); toastT=setTimeout(()=>t.className='toast'+(err?' err':''), 3000);
}
const byRank = () => (DATA.scripts||[]).slice().sort((a,b)=>a.rank-b.rank);
const getS = id => (DATA.scripts||[]).find(s=>s.id===id);
function markDirty(){ dirty=true; $('savebar').classList.remove('hide'); $('savemsg').textContent=T('有未保存的改动','Unsaved changes'); }

/** rank 重新压实成 0..n-1（永远保持稠密且唯一） */
function reseat(){
  byRank().forEach((s,i)=>s.rank=i);
}
/** 把一本放到「它这个分数组」的末尾——新增和改分数都走这里，保证 rank 与 score 不矛盾 */
function seatByScore(s){
  const others = byRank().filter(x=>x!==s);
  let idx = others.findIndex(x=>x.score < s.score);
  if(idx<0) idx = others.length;
  others.splice(idx, 0, s);
  others.forEach((x,i)=>x.rank=i);
}
/** 顺序与分数是否自洽（结构性自检，摆在界面上） */
function orderOK(){
  const a = byRank();
  for(let i=0;i<a.length-1;i++) if(a[i].score < a[i+1].score - 1e-9) return {ok:false, at:[a[i],a[i+1]]};
  return {ok:true};
}

/* ---------- 页签 ---------- */
const TABS = [['tier','梯队','Tiers'],['cat','分类榜','By type'],['year','年度榜','By year'],
              ['list','推荐榜','Picks'],['host','开本','Hosting'],['sess','场次','Sessions']];
function drawNav(){
  $('nav').innerHTML = TABS.map(([k,zh,en])=>
    `<button class="tab${TAB===k?' on':''}" data-tab="${k}">${T(zh,en)}</button>`).join('');
  $('nav').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab; drawNav(); render();});
}

/* ---------- 渲染 ---------- */
function render(){
  if(!DATA) return;
  TABS.forEach(([k])=>$('view-'+k).classList.toggle('hide', k!==TAB));
  ({tier:drawTier, cat:drawCat, year:drawYear, list:drawLists, host:drawHost, sess:drawSess})[TAB]();
  const n = DATA.scripts.length, chk = orderOK();
  const withRev = DATA.scripts.filter(s=>s.review).length;
  $('stat').textContent = `${n} ${T('本','scripts')} · ${DATA.lists.length} ${T('榜','lists')} · ${DATA.sessions.length} ${T('场次','sessions')}`
    + (withRev ? ` · ${withRev} ${T('有剧评','reviewed')}` : '')
    + (chk.ok ? ` · ${T('顺序自洽 ✓','order ✓')}` : ` · ⚠️ ${T('顺序与分数矛盾','order vs score')}`);
}

const chipHTML = (s, no) => `<span class="chip ty-${s.type}" data-id="${s.id}">${no?`<span class="no">${no}</span>`:''}${esc(s.name)}` +
  `${s.review?'<span class="sc" title="有剧评">✍️</span>':''}<span class="sc">${s.score}</span></span>`;
function wireChips(root){
  root.querySelectorAll('.chip[data-id],li[data-id],tr[data-id]').forEach(e=>e.onclick=()=>openDetail(e.dataset.id));
}

function drawTier(){
  const all = byRank();
  let h = `<h2 class="head">${T('梯队','Tiers')}</h2>
    <div class="sub">${T('分数决定档位；同一档内从左到右就是你排的高低','Score sets the tier; order within a tier is yours')}</div><div class="card">`;
  TIERS.forEach(t=>{
    const list = all.filter(s=>tierOf(s.score)===t);
    if(!list.length) return;
    h += `<div class="tierrow"><div class="tiername ${tierClass(t)}">${t}</div>
      <div><div class="meta" style="margin-bottom:5px">${list.length} ${T('本','scripts')}</div>
      <div class="chips">${list.map(s=>chipHTML(s)).join('')}</div></div></div>`;
  });
  $('view-tier').innerHTML = h+'</div>';
  wireChips($('view-tier'));
}

function drawCat(){
  const all = byRank();
  let h = `<h2 class="head">${T('分类榜','By type')}</h2>
    <div class="sub">${T('每本只属于一个类型；名次由你排的顺序自动生成','One type per script; ranks come from your order')}</div>
    <div class="cols c4">`;
  TYPES.forEach(t=>{
    const list = all.filter(s=>s.type===t);
    h += `<div class="card"><div class="colhead"><span>${tyLabel(t)}</span><span>${list.length}</span></div>
      <ol class="rank">${list.map(s=>`<li data-id="${s.id}"><span>${esc(s.name)}</span><span class="s">${s.score}</span></li>`).join('')}</ol></div>`;
  });
  $('view-cat').innerHTML = h+'</div>';
  wireChips($('view-cat'));
}

let yearTopOnly = true;
function drawYear(){
  const all = byRank();
  const years = [...new Set(all.map(s=>s.year).filter(Boolean))].sort((a,b)=>b-a);
  const noYear = all.filter(s=>!s.year).length;
  let h = `<h2 class="head">${T('年度榜','By year')}</h2>
    <div class="sub">${T('按类型分三栏；前十是全类型合起来算的','Split by type; top-10 is across all types')}</div>
    <div class="card row"><label class="meta"><input type="checkbox" id="ytop" ${yearTopOnly?'checked':''}> ${T('只看 A+ 及以上','A+ and above only')}</label>
      <span class="meta">${T('还没填年份的','No year yet')}: ${noYear} ${T('本','scripts')}</span></div>`;
  const GROUPS = [['推理'],['情感'],['立意','欢乐']];
  years.forEach(y=>{
    let inY = all.filter(s=>s.year===y);
    if(yearTopOnly) inY = inY.filter(s=>TOP_TIERS.has(tierOf(s.score)));
    if(!inY.length) return;
    const top10 = new Map(inY.slice(0,10).map((s,i)=>[s.id,i+1]));
    h += `<div class="card"><div class="colhead"><span>${y}</span><span>${inY.length} ${T('本','scripts')}</span></div><div class="cols c3">`;
    GROUPS.forEach(g=>{
      const list = inY.filter(s=>g.includes(s.type));
      h += `<div><div class="meta" style="margin-bottom:6px">${g.map(tyLabel).join(' ·  ')}</div>
        <div class="chips">${list.map(s=>chipHTML(s, top10.get(s.id))).join('')||`<span class="meta">—</span>`}</div></div>`;
    });
    h += `</div></div>`;
  });
  $('view-year').innerHTML = h;
  $('ytop').onchange = e => { yearTopOnly = e.target.checked; drawYear(); };
  wireChips($('view-year'));
}

function drawLists(){
  let h = `<h2 class="head">${T('推荐榜','Picks')}</h2>
    <div class="sub">${T('这些是你手工挑的，推不出来 —— 顺序也由你定','Hand-picked lists — order is yours')}</div>
    <div class="row" style="margin-bottom:14px"><button class="btn ghost" id="addlist">＋ ${T('新建榜单','New list')}</button></div>
    <div class="cols c3">`;
  DATA.lists.forEach(l=>{
    h += `<div class="card"><div class="colhead"><span>${esc(l.name)}</span><span>${l.items.length}</span></div>
      <ol class="rank">${l.items.map((id,i)=>{ const s=getS(id); if(!s) return '';
        return `<li data-id="${id}"><span>${esc(s.name)}</span><span class="s">${s.score}</span></li>`;}).join('')}</ol>
      <div class="row" style="margin-top:9px"><button class="btn ghost" data-edit="${l.id}">${T('编辑','Edit')}</button></div></div>`;
  });

  wireChips($('view-list'));

    const name = prompt(T('新榜单叫什么？','List name?')); if(!name) return;
    DATA.lists.push({id:'l'+Date.now().toString(36), name:name.trim(), items:[]});
    markDirty(); drawLists();
  };
  $('view-list').querySelectorAll('[data-edit]').forEach(b=>b.onclick=e=>{e.stopPropagation(); editList(b.dataset.edit);});
}

function drawHost(){

  let h = `<h2 class="head">${T('开本','Hosting')}</h2>
    <div class="sub">${T('我自己开的本 —— 开一场点一下「＋1」就行','Scripts I host — tap +1 after a session')}</div>
    <div class="card"><table><tr><th>${T('剧本','Script')}</th><th>${T('人数','Players')}</th><th>${T('时长','Length')}</th>
      <th>${T('难度','Level')}</th><th>${T('形式','Form')}</th><th class="num">${T('开本','Opened')}</th>
      <th class="num">${T('测本','Tested')}</th><th class="num">${T('总场','Total')}</th><th>${T('测车时长','Test hrs')}</th><th></th></tr>`;
  list.forEach(s=>{
    const ho=s.host;
    h += `<tr><td>${esc(s.name)}</td><td>${esc(s.players||'')}</td><td>${esc(s.duration||'')}</td>
      <td>${esc(s.difficulty||'')}</td><td>${esc(s.form||'')}</td>
      <td class="num">${ho.opened||0}</td><td class="num">${ho.tested||0}</td>
      <td class="num">${(ho.opened||0)+(ho.tested||0)}</td><td class="meta">${esc(ho.testHours||'')}</td>
      <td><button class="btn ghost" data-plus="${s.id}">＋1</button></td></tr>`;
  });
  h += `</table></div><div class="row"><button class="btn ghost" id="addhost">＋ ${T('把一本加进开本单','Add to hosting')}</button></div>`;
  $('view-host').innerHTML = h;
  $('view-host').querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{
    const s=getS(b.dataset.plus); s.host.opened=(s.host.opened||0)+1; markDirty(); drawHost();
    toast(T(`${s.name} 开本 +1`, `${s.name} +1`));
  });
  $('addhost').onclick = ()=>{
    const nm = prompt(T('哪一本？（输入剧本名，要和库里一致）','Which script?')); if(!nm) return;
    const s = DATA.scripts.find(x=>x.name===nm.trim() || (x.aliases||[]).includes(nm.trim()));
    if(!s) return toast(T('库里没有这一本','Not found'), true);

function drawSess(){
  let h = `<h2 class="head">${T('铁屁股实录','Marathon log')}</h2>
    <div class="sub">${T('长时场次；一天连开两本就写两本','Long sessions; two scripts in a day = two entries')}</div>
    <div class="row" style="margin-bottom:12px"><button class="btn ghost" id="addsess">＋ ${T('加一条','Add')}</button></div>
    <div class="card"><table><tr><th>${T('场次','Session')}</th><th>${T('剧本','Scripts')}</th><th class="num">${T('时长','Hours')}</th><th></th></tr>`;
  DATA.sessions.slice().sort((a,b)=>parseFloat(b.hours)-parseFloat(a.hours)).forEach(s=>{
    h += `<tr><td>${esc(s.label)}</td>
      <td class="meta">${(s.scripts||[]).map(i=>esc((getS(i)||{}).name||'?')).join(' ＋ ')}</td>
      <td class="num">${esc(s.hours)}</td>
      <td><button class="btn ghost" data-del="${s.id}">${T('删','Del')}</button></td></tr>`;
  });
  $('view-sess').innerHTML = h+'</table></div>';
  $('view-sess').querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{
    if(!confirm(T('删掉这条场次？','Delete this session?'))) return;
    DATA.sessions = DATA.sessions.filter(x=>x.id!==b.dataset.del); markDirty(); drawSess();
  });
  $('addsess').onclick = ()=>{
    const label = prompt(T('这场叫什么？（比如 塔+龙）','Session label?')); if(!label) return;
    const hrs = prompt(T('多久？（比如 14h）','Hours?')) || '';
    const names = prompt(T('哪几本？用 + 分开，要和库里的名字一致（可留空以后补）','Which scripts? separate with +')) || '';
    const ids = names.split(/[+＋]/).map(x=>x.trim()).filter(Boolean).map(nm=>{
      const s = DATA.scripts.find(x=>x.name===nm || (x.aliases||[]).includes(nm));
      if(!s) toast(T(`没找到「${nm}」，先留空`, `No match: ${nm}`), true);
      return s ? s.id : null;
    }).filter(Boolean);
    DATA.sessions.push({id:'n'+Date.now().toString(36), label:label.trim(), scripts:ids, hours:hrs.trim()});
    markDirty(); drawSess();
  };
}

/* ---------- 搜索 ---------- */
function doSearch(){
  const q = $('q').value.trim().toLowerCase();
  const box = $('searchout');
  if(!q){ box.classList.add('hide'); return; }
  const hit = byRank().filter(s => [s.name, s.note, s.review, s.author, s.publisher]
      .some(v => (v||'').toLowerCase().includes(q))
      || (s.aliases||[]).some(a=>a.toLowerCase().includes(q)));
  box.classList.remove('hide');
  box.innerHTML = `<div class="colhead"><span>${T('搜到','Found')} ${hit.length}</span><span>${esc(q)}</span></div>
    <div class="chips">${hit.slice(0,80).map(s=>chipHTML(s)).join('')||`<span class="meta">${T('没有','none')}</span>`}</div>`;
  wireChips(box);
}

/* ---------- 详情 / 编辑 ---------- */
function closeModal(){ $('mask').classList.remove('on'); }
$('mask').onclick = e => { if(e.target.id==='mask') closeModal(); };

function openDetail(id){
  const s = getS(id); if(!s) return;
  const all = byRank();
  const t = tierOf(s.score);
  const inType = all.filter(x=>x.type===s.type);
  const posType = inType.findIndex(x=>x.id===id)+1;
  const inYear = s.year ? all.filter(x=>x.year===s.year && TOP_TIERS.has(tierOf(x.score))) : [];
  const posYear = inYear.findIndex(x=>x.id===id)+1;
  const inLists = DATA.lists.filter(l=>l.items.includes(id));
  const inSess = DATA.sessions.filter(x=>(x.scripts||[]).includes(id));
  const sameScore = all.filter(x=>x.score===s.score);
  const i = sameScore.findIndex(x=>x.id===id);

  $('modal').innerHTML = `
    <h3>${esc(s.name)}</h3>
    <div class="meta" style="margin-bottom:12px">${T('全库第','#')} ${s.rank+1} · ${tyLabel(s.type)} ${T('第','#')}${posType}
      ${s.year?` · ${s.year} ${posYear?T('年度第','#')+posYear:''}`:''}</div>
    <div class="row" style="margin-bottom:12px">
      <span class="tiername ${tierClass(t)}" style="padding:4px 12px;font-size:14px">${t}</span>
      <span class="badge">${s.score}</span>
      ${s.extScore!=null?`<span class="badge" title="${T('外部评分，仅供参考，不参与梯队与排序','External rating — reference only')}">${T('外部','ext')} ${s.extScore}</span>`:''}
      ${(s.aliases||[]).map(a=>`<span class="badge">${esc(a)}</span>`).join('')}
    </div>
    ${(s.author||s.publisher)?`<div class="meta" style="margin-bottom:10px">${s.author?T('作者 ','Author ')+esc(s.author):''}${s.author&&s.publisher?' · ':''}${s.publisher?T('发行 ','Publisher ')+esc(s.publisher):''}</div>`:''}
    ${s.review?`<div class="card" style="background:var(--panel2);white-space:pre-wrap">${esc(s.review)}</div>`:''}
    ${s.note?`<p style="margin-bottom:12px">${esc(s.note)}</p>`:''}
    ${inLists.length?`<div class="meta" style="margin-bottom:6px">${T('在这些榜里','In lists')}: ${inLists.map(l=>esc(l.name)).join('、')}</div>`:''}
    ${inSess.length?`<div class="meta" style="margin-bottom:6px">${T('铁屁股','Marathon')}: ${inSess.map(x=>esc(x.label)+' '+esc(x.hours)).join('、')}</div>`:''}
    ${s.host?`<div class="meta" style="margin-bottom:6px">${T('开本','Hosted')} ${s.host.opened||0} · ${T('测本','Tested')} ${s.host.tested||0}</div>`:''}
    <div class="card" style="background:var(--panel2);margin:14px 0 10px">
      <div class="meta" style="margin-bottom:7px">${T('同分的','Same score')} ${s.score} ${T('共','·')} ${sameScore.length} ${T('本，这里排第','· #')}${i+1}
        —— ${T('同分也有高低，可以上下挪','ties are ordered too')}</div>
      <div class="row">
        <button class="btn ghost" id="mv-up" ${i<=0?'disabled':''}>↑ ${T('上移','Up')}</button>
        <button class="btn ghost" id="mv-dn" ${i>=sameScore.length-1?'disabled':''}>↓ ${T('下移','Down')}</button>
      </div>
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="md-edit">${T('编辑','Edit')}</button>
      <button class="btn ghost" id="md-close">${T('关闭','Close')}</button>
      <button class="btn danger" id="md-del" style="margin-left:auto">${T('删除','Delete')}</button>
    </div>`;
  $('mask').classList.add('on');
  $('md-close').onclick = closeModal;
  $('md-edit').onclick = ()=>openEdit(id);
  $('md-del').onclick = ()=>{
    if(!confirm(T(`删掉「${s.name}」？它会从所有榜单和场次里一起消失。`, `Delete ${s.name}?`))) return;
    DATA.scripts = DATA.scripts.filter(x=>x.id!==id);
    DATA.lists.forEach(l=>l.items = l.items.filter(x=>x!==id));
    DATA.sessions.forEach(x=>x.scripts = (x.scripts||[]).filter(y=>y!==id));
    reseat(); markDirty(); closeModal(); render();
  };
  const swap = d => {
    const other = sameScore[i+d]; if(!other) return;
    const a = s.rank; s.rank = other.rank; other.rank = a;
    markDirty(); openDetail(id); render();
  };
  $('mv-up').onclick = ()=>swap(-1);
  $('mv-dn').onclick = ()=>swap(1);
}

  $('modal').innerHTML = `
    <h3>${id?T('编辑','Edit'):T('新增剧本','New script')}</h3>
    <div class="fld"><label>${T('剧本名','Name')}</label><input id="e-name" value="${esc(s.name)}"></div>
    <div class="row">
      <div class="fld" style="flex:1"><label>${T('分数 0-10','Score')}</label><input id="e-score" type="number" step="0.1" min="0" max="10" value="${s.score??''}"></div>
      <div class="fld" style="flex:1"><label>${T('类型','Type')}</label><select id="e-type">${TYPES.map(t=>`<option value="${t}"${s.type===t?' selected':''}>${tyLabel(t)}</option>`).join('')}</select></div>
      <div class="fld" style="flex:1"><label>${T('年份','Year')}</label><input id="e-year" type="number" min="2000" max="2099" value="${s.year??''}"></div>
    </div>
    <div class="row">
      <div class="fld" style="flex:2"><label>${T('作者','Author')}</label><input id="e-author" value="${esc(s.author||'')}"></div>
      <div class="fld" style="flex:2"><label>${T('发行','Publisher')}</label><input id="e-pub" value="${esc(s.publisher||'')}"></div>
      <div class="fld" style="flex:1"><label>${T('外部评分','Ext. score')}</label><input id="e-ext" type="number" step="0.1" value="${s.extScore??''}"></div>
    </div>
    <div class="fld"><label>${T('我的剧评','My review')}</label><textarea id="e-review" rows="4">${esc(s.review||'')}</textarea></div>
    <div class="fld"><label>${T('别名（逗号分隔，榜单里写的简称）','Aliases')}</label><input id="e-alias" value="${esc((s.aliases||[]).join(', '))}"></div>
    <div class="fld"><label>${T('备注','Note')}</label><textarea id="e-note" rows="2">${esc(s.note||'')}</textarea></div>
    <p class="meta" id="e-tier"></p>
    <div class="row" style="margin-top:14px">
      <button class="btn" id="e-ok">${T('保存','Save')}</button>
      <button class="btn ghost" id="e-cancel">${T('取消','Cancel')}</button>
    </div>`;
  $('mask').classList.add('on');
  const showTier = ()=>{
    const v = parseFloat($('e-score').value);
    $('e-tier').textContent = isNaN(v) ? '' :
      T(`分数 ${v} → 落进 ${tierOf(v)} 档；会放到该分数组的末尾，之后可以上下挪`,
        `${v} → tier ${tierOf(v)}; placed at the end of that score group`);
  };
  $('e-score').oninput = showTier; showTier();
  $('e-cancel').onclick = ()=> id ? openDetail(id) : closeModal();
  $('e-ok').onclick = ()=>{
    const name = $('e-name').value.trim();
    const score = parseFloat($('e-score').value);
    if(!name) return toast(T('得有名字','Name required'), true);
    if(isNaN(score) || score<0 || score>10) return toast(T('分数要在 0-10 之间','Score 0-10'), true);
    const dup = DATA.scripts.find(x=>x.name===name && x.id!==id);
    if(dup) return toast(T('库里已经有同名的了','Duplicate name'), true);
    const yr = parseInt($('e-year').value);
    const rec = id ? s : {id:'s'+Date.now().toString(36), rank:DATA.scripts.length};
    const scoreChanged = !id || rec.score !== score;
    const ext = parseFloat($('e-ext').value);
    Object.assign(rec, {name, score, type:$('e-type').value, year:isNaN(yr)?null:yr,
      author:$('e-author').value.trim(), publisher:$('e-pub').value.trim(),
      extScore:isNaN(ext)?null:ext, review:$('e-review').value.trim(),
      aliases:$('e-alias').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),
      note:$('e-note').value.trim()});
    if(!id) DATA.scripts.push(rec);
    // 改了分数就重新落位，保证「rank 顺序与分数一致」这条不变量永远成立
    if(scoreChanged) seatByScore(rec); else reseat();
    markDirty(); openDetail(rec.id); render();
    toast(T(`已保存到本地，记得点右下角「保存」推上去`,'Saved locally — hit Save to push'));
  };
}

function editList(lid){
  const l = DATA.lists.find(x=>x.id===lid); if(!l) return;
  const draw = ()=>{
    $('modal').innerHTML = `
      <h3>${esc(l.name)}</h3>
      <div class="meta" style="margin-bottom:10px">${T('顺序就是名次，可以上下挪','Order = rank')}</div>
      <ol class="rank">${l.items.map((id,i)=>{const s=getS(id);
        return `<li><span>${esc(s?s.name:'?')}</span>
          <span class="s"><button class="btn ghost" data-u="${i}" ${i===0?'disabled':''}>↑</button>
          <button class="btn ghost" data-d="${i}" ${i===l.items.length-1?'disabled':''}>↓</button>
          <button class="btn ghost" data-x="${i}">×</button></span></li>`;}).join('')}</ol>
      <div class="fld" style="margin-top:12px"><label>${T('加一本（输名字）','Add by name')}</label><input id="l-add"></div>
      <div class="row"><button class="btn" id="l-ok">${T('完成','Done')}</button>
        <button class="btn ghost" id="l-ren">${T('改名','Rename')}</button>
        <button class="btn danger" id="l-del" style="margin-left:auto">${T('删掉这个榜','Delete list')}</button></div>`;
    $('modal').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const i=+b.dataset.u;
      [l.items[i-1],l.items[i]]=[l.items[i],l.items[i-1]]; markDirty(); draw();});
    $('modal').querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const i=+b.dataset.d;
      [l.items[i+1],l.items[i]]=[l.items[i],l.items[i+1]]; markDirty(); draw();});
    $('modal').querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{
      l.items.splice(+b.dataset.x,1); markDirty(); draw();});
    $('l-add').onkeydown = e => {
      if(e.key!=='Enter') return;
      const nm = e.target.value.trim(); if(!nm) return;
      const s = DATA.scripts.find(x=>x.name===nm || (x.aliases||[]).includes(nm));
      if(!s) return toast(T('库里没有这一本','Not found'), true);
      if(l.items.includes(s.id)) return toast(T('已经在榜里了','Already in list'), true);
      l.items.push(s.id); e.target.value=''; markDirty(); draw();
    };
    $('l-ok').onclick = ()=>{ closeModal(); drawLists(); };
    $('l-ren').onclick = ()=>{ const n=prompt(T('改成什么名字？','New name?'), l.name); if(n){l.name=n.trim(); markDirty(); draw();} };
    $('l-del').onclick = ()=>{ if(!confirm(T('删掉整个榜单？','Delete the whole list?'))) return;
      DATA.lists = DATA.lists.filter(x=>x.id!==lid); markDirty(); closeModal(); drawLists(); };
  };
  draw(); $('mask').classList.add('on');
}

/* ---------- 保存 ---------- */
async function save(){
  if(!dirty) return;
  $('btn-save').disabled = true; $('savemsg').textContent = T('保存中…','Saving…');
  try{
    DATA.updated_at = new Date().toISOString();
    SHA = await ghPut(DATA, SHA, 'script-archive: 更新');
    dirty = false; $('savebar').classList.add('hide');
    toast(T('已保存','Saved'));
  }catch(e){
    $('savemsg').textContent = T('保存失败','Save failed');
    toast(T('保存失败: ','Save failed: ')+e.message, true);
  }finally{ $('btn-save').disabled = false; }
}

/* ---------- 连接 / 启动 ---------- */
function loadCfg(){
  try{ const c = JSON.parse(localStorage.getItem('sa_cfg')||'null'); if(c) CFG = c; }catch{}
  /* 若同源下存在共享配置，用它补全空缺项（不覆盖已填的） */
  try{ const p = JSON.parse(localStorage.getItem('pha-config')||'null');
    if(p){ if(!CFG.owner&&p.owner)CFG.owner=p.owner; if(!CFG.repo&&p.repo)CFG.repo=p.repo; if(!CFG.token&&p.token)CFG.token=p.token; }
  }catch{}
}
function setConn(ok){
  $('led').className = 'led'+(ok?'':' off');
  $('conn').textContent = ok ? `${CFG.owner}/${CFG.repo}` : T('未连接','Offline');
}
async function boot(){
  setConn(false);
  try{
    const r = await ghGet();
    DATA = r.data || {updated_at:'', scripts:[], lists:[], sessions:[]};
    DATA.scripts ||= []; DATA.lists ||= []; DATA.sessions ||= [];
    SHA = r.sha;
    reseat();
    setConn(true); drawNav(); render();
  }catch(e){
    if(e.message==='AUTH'){ openGate(T('共享令牌用不了（无效或没授权这个仓库）','Shared token rejected')); return; }
    toast(T('读取失败: ','Load failed: ')+e.message, true);
  }
}
$('g_go').onclick = ()=>{
  const o=$('g_owner').value.trim(), rp=$('g_repo').value.trim(), tk=$('g_token').value.trim();
  if(!o||!rp||!tk){ $('g_err').textContent = T('三项都要填','All three required'); return; }
  CFG = {owner:o, repo:rp, token:tk};
  try{ localStorage.setItem('sa_cfg', JSON.stringify(CFG)); }catch{}
  $('gate').classList.remove('on'); boot();
};
/** 打开设置框：**永远把已知的值填回去**，并说明缺的是哪一项 */
function openGate(msg){
  $('g_owner').value = CFG.owner || '';
  $('g_repo').value  = CFG.repo  || '';
  $('g_token').value = CFG.token || '';
  const miss = ['owner','repo','token'].filter(k=>!CFG[k]);
  $('g_err').textContent = msg || (miss.length
    ? T(`共享配置里缺：${miss.join(' / ')}`, `Missing from shared config: ${miss.join(' / ')}`)
    : '');
  $('gate').classList.add('on');
}
$('btn-set').onclick = ()=>openGate('');
$('btn-refresh').onclick = ()=>{
  if(dirty && !confirm(T('有未保存的改动，刷新会丢掉，继续？','Unsaved changes will be lost. Continue?'))) return;
  dirty=false; $('savebar').classList.add('hide'); boot();
};
$('btn-lang').onclick = ()=>{
  lang = lang==='en' ? 'zh' : 'en';
  try{ localStorage.setItem('pha-lang', lang); }catch{}
  applyLang(); drawNav(); render();
};
function applyLang(){
  document.documentElement.lang = lang==='en' ? 'en' : 'zh-CN';
  $('btn-lang').textContent = lang==='en' ? '中' : 'EN';
  $('btn-refresh').textContent = T('刷新','Refresh');
  $('btn-set').textContent = T('设置','Settings');
  $('btn-add').textContent = '＋ '+T('新增剧本','New script');
  $('btn-save').textContent = T('保存','Save');
  $('q').placeholder = T('搜剧本名…','Search…');
  $('g_sub').textContent = T('连接你的私有数据仓库。凭据只保存在本机浏览器，永远不会写入网页代码。',
    'Connect your private data repo. Credentials stay in this browser only.');
  $('g_l1').textContent = T('GitHub 用户名 (owner)','GitHub user (owner)');
  $('g_l2').textContent = T('私有仓库名 (repo)','Private repo');
  $('g_l3').textContent = T('Token（只需该仓库 Contents 读写）','Token (Contents R/W)');
  $('g_go').textContent = T('连接','Connect');
  if(DATA) setConn(true);
}
$('btn-add').onclick = ()=>openEdit(null);
$('btn-save').onclick = save;
let qT=null;
$('q').oninput = ()=>{ clearTimeout(qT); qT=setTimeout(doSearch, 140); };
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closeModal();
  if((e.metaKey||e.ctrlKey) && e.key==='s'){ e.preventDefault(); save(); }
});
window.addEventListener('beforeunload', e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });

loadCfg(); applyLang();
// 有令牌就直接进（owner/repo 缺了才问），而不是三样缺一就把人挡在登录页外。
if(CFG.token && CFG.owner && CFG.repo) boot();
else openGate('');
</script>
</body>
</html>
